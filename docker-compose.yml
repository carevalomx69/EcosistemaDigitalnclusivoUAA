# Ejecución local: docker compose up --build   ->   http://localhost:8000
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Contraseña de las cuentas de demostración (cámbiala si quieres)
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-local-2026}
      AVISO_RESPONSABLE: ${AVISO_RESPONSABLE:-}
      AVISO_CONTACTO: ${AVISO_CONTACTO:-}
      AVISO_ALOJAMIENTO: ${AVISO_ALOJAMIENTO:-}
      AVISO_CONSERVACION: ${AVISO_CONSERVACION:-}
    volumes:
      - datos:/app/instance

volumes:
  datos:
