services:
  - type: web
    name: ecosistema-inclusivo-uaa-tesis
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # El plan gratis de Render usa disco efímero: la base SQLite se reinicia en
    # cada arranque. seed.py solo siembra si la base está vacía, así que es
    # seguro ejecutarlo en cada arranque (con una base persistente no borra nada).
    startCommand: "python seed.py && gunicorn --bind 0.0.0.0:$PORT run:app"
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Contraseña de las cuentas de demostración. Se genera al crear el
      # servicio y se consulta en el panel de Render (Environment).
      - key: DEMO_PASSWORD
        generateValue: true
      # Datos del aviso de privacidad. Complétalos en el panel de Render antes de un piloto.
      - key: AVISO_RESPONSABLE
        sync: false
      - key: AVISO_CONTACTO
        sync: false
      - key: AVISO_ALOJAMIENTO
        value: Render (servicio de nube de terceros)
      - key: AVISO_CONSERVACION
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
