services:
  - type: web
    name: ecosistema-inclusivo-uaa
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # El plan gratis de Render usa disco efímero: los datos se reinician en
    # cada arranque. Se vuelve a sembrar la BD de prueba en cada boot para
    # garantizar que las credenciales de demo siempre funcionen.
    startCommand: "python seed.py && gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.7
